[project]
name = "rigcheck"
version = "0.1.0"
description = "Test a local LLM setup (model + engine + coding agent): tool calls and turn latency, with intervals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alp Cetin" }]
keywords = ["llm", "llama.cpp", "ollama", "tool-calling", "benchmark", "coding-agents"]
dependencies = ["httpx>=0.27", "jsonschema>=4.21"]

[project.urls]
Homepage = "https://github.com/mottopanikeiku/rigcheck"

[project.scripts]
rigcheck = "rigcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
